# Habilitar la consola web de H2 para que puedas ver tus tablas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración de conexión a la base de datos en memoria
spring.datasource.url=jdbc:h2:mem:0xdropdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate (ORM): Le dice a Spring que cree las tablas automáticamente basadas en tu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración del tamaño máximo de archivos permitidos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB